version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: rahisisha_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rahisisha_user
      POSTGRES_PASSWORD: rahisisha_pass
      POSTGRES_DB: rahisisha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: rahisisha_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: